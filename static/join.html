<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>Join Quiz</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 22px; }
  .box { width: 100%; max-width: 420px; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .brand-logo { width: clamp(56px, 16vw, 72px); margin: 0 auto; }
  .brand h1 { font-size: 27px; margin-top: 7px; }
  #pin { font-family: var(--mono); font-size: 30px; letter-spacing: 0.3em;
    text-align: center; text-transform: uppercase; padding: 16px 10px; }
  #num { font-family: var(--mono); font-size: 30px; text-align: center; padding: 16px 10px; }
  .err { background: var(--red-dim); border: 1px solid var(--red); color: #ffb4b6;
    padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }
  .hint { font-size: 12px; color: var(--dim); text-align: center; margin-top: 18px;
    line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <img class="brand-logo" src="/icon.svg" alt="">
    <h1 id="qname">Quiz</h1>
  </div>

  <div class="card">
    <div id="err" class="err hidden"></div>
    <form id="form">
      <div class="field">
        <label for="num">Your team number</label>
        <input id="num" type="number" inputmode="numeric" min="1" max="999"
               autocomplete="off" placeholder="7" required>
      </div>
      <div class="field">
        <label for="pin">Team PIN</label>
        <input id="pin" type="text" inputmode="text" autocapitalize="characters"
               autocomplete="off" maxlength="8" placeholder="••••" required>
      </div>
      <button id="go" type="submit" class="btn-primary btn-block btn-xl">JOIN QUIZ</button>
    </form>
    <div class="hint">
      Your team number and PIN are on the slip at your table.<br>
      One device per team &mdash; decide now who holds the phone.
    </div>
  </div>

  <div class="hint" style="margin-top:20px">
    Turn <b>mobile data off</b> and stay on the quiz Wi-Fi.<br>
    Keep this page open: your answers save automatically.
  </div>
</div>

<script src="/live.js"></script>
<script>
(function () {
  var P = window.PNB;
  var params = new URLSearchParams(location.search);

  P.get('/api/health').then(function (h) {
    if (h.quiz) { P.el('qname').textContent = h.quiz; document.title = h.quiz; }
  }).catch(function () {});

  // A per-team QR encodes ?n=<number> so the team only types the PIN.
  var pre = params.get('n');
  if (pre) { P.el('num').value = pre; setTimeout(function () { P.el('pin').focus(); }, 80); }
  else { setTimeout(function () { P.el('num').focus(); }, 80); }

  function fail(msg) {
    var e = P.el('err');
    e.textContent = msg;
    e.classList.remove('hidden');
  }

  P.el('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    P.el('err').classList.add('hidden');
    var btn = P.el('go');
    btn.disabled = true;
    btn.textContent = 'JOINING…';
    P.post('/api/team/join', {
      number: Number(P.el('num').value),
      pin: P.el('pin').value.trim().toUpperCase(),
      device_id: P.deviceId()
    }).then(function (r) {
      localStorage.setItem('wiz_team_token', r.token);
      localStorage.setItem('wiz_team_number', r.team.number);
      localStorage.setItem('wiz_team_name', r.team.name);
      location.replace('/team');
    }).catch(function (e) {
      fail(e.message || 'Could not join');
      btn.disabled = false;
      btn.textContent = 'JOIN QUIZ';
    });
  });

  // Already signed in on this device? Offer to go straight back in.
  var tok = localStorage.getItem('wiz_team_token');
  if (tok && !pre) {
    P.get('/api/team/me', tok).then(function () {
      location.replace('/team');
    }).catch(function (e) { if (e.status === 401) localStorage.removeItem('wiz_team_token'); });
  }
})();
</script>
</body>
</html>
